    <path d="M406 226 h164 a24 24 0 0 1 24 24 v58 a24 24 0 0 1 -24 24 h-96 v30 l-36 -30 h-32 a24 24 0 0 1 -24 -24 v-58 a24 24 0 0 1 24 -24 z"
