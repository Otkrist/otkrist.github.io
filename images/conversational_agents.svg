          fill="#f7f7f6" stroke="#cfceca" stroke-width="3"/>
    <!-- voice waveform -->
    <g fill="#2563eb">
      <rect x="118" y="130" width="9" height="30" rx="4.5"/>
      <rect x="145" y="112" width="9" height="66" rx="4.5"/>
      <rect x="172" y="92"  width="9" height="106" rx="4.5"/>
      <rect x="199" y="122" width="9" height="46" rx="4.5"/>
      <rect x="226" y="80"  width="9" height="130" rx="4.5"/>
      <rect x="253" y="122" width="9" height="46" rx="4.5"/>
      <rect x="280" y="92"  width="9" height="106" rx="4.5"/>
      <rect x="307" y="112" width="9" height="66" rx="4.5"/>
      <rect x="334" y="130" width="9" height="30" rx="4.5"/>
    </g>
  </g>

  <!-- reply bubble (typing) -->
