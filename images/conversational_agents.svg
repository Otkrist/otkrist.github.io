      <rect x="150" y="112" width="10" height="56" rx="5"/>
      <rect x="180" y="92"  width="10" height="96" rx="5"/>
      <rect x="210" y="120" width="10" height="40" rx="5"/>
      <rect x="240" y="80"  width="10" height="120" rx="5"/>
      <rect x="270" y="120" width="10" height="40" rx="5"/>
